    <style>
:root {
  font-size: 16pt;
  font-family: 'Raleway', sans-serif;
}
body {
  background-color: black;
  background-image: url(./bg.png);
  background-repeat: no-repeat;
  background-size: cover;
  width: 100vw;
  height: 100vh;
  overflow: hidden;

  position: fixed;
  top: 0;
  left: 0;

  display: flex;
  justify-content: center;
  align-items: center;
}
#fg {
  width: 16rem;
}
#fg .logo {
  height: 8rem;
  text-align: center;
}
#fg .logo svg {
  color: white;
  width: 8rem;
  height: 100%;
}
#fg h1 {
  color: white;
  font-size: 2rem;
  text-align: center;
}
#fg p {
  text-align: center;
}
#fg p.subtitle {
  color: white;
  margin-bottom: 0.5rem;
}
#fg p.small {
  font-size: 0.8rem;
  line-height: 1em;
  color: lightgray;
}
#fg ul.icons {
  margin: 1rem 0;
  display: flex;
  justify-content: space-around;
}
#fg ul.icons li {
  width: 2rem;
  height: 2rem;
  padding: 0.2rem;
  background-color: white;
  border-radius: 1.6rem;
}
#fg ul.icons svg {
  color: #323232;
}
